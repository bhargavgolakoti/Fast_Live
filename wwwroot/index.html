<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Visitor Count</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Georgia, "Times New Roman", serif;
            background: #f3f0e7;
            color: #1f3028;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background-image: linear-gradient(90deg, rgba(31, 48, 40, .05) 1px, transparent 1px), linear-gradient(rgba(31, 48, 40, .05) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        main {
            width: min(100%, 560px);
        }

        .panel {
            border: 1px solid #1f3028;
            background: #fbfaf5;
            box-shadow: 8px 8px 0 #d57d4a;
            padding: clamp(28px, 7vw, 52px);
        }

        .eyebrow {
            margin: 0 0 22px;
            color: #b24d25;
            font: 700 12px/1.2 Verdana, sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(34px, 7vw, 56px);
            line-height: 1;
            font-weight: 500;
        }

        output {
            display: block;
            margin: 38px 0 12px;
            font: 700 clamp(72px, 18vw, 128px)/.85 Verdana, sans-serif;
            letter-spacing: 0;
            color: #1c6a5a;
        }

        #status {
            min-height: 24px;
            margin: 0;
            color: #53635b;
            font: 14px/1.5 Verdana, sans-serif;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 32px;
        }

        a {
            display: inline-block;
            border: 1px solid #1f3028;
            padding: 11px 15px;
            color: #1f3028;
            font: 700 13px/1 Verdana, sans-serif;
            text-decoration: none;
        }

        a:hover {
            background: #1f3028;
            color: #fbfaf5;
        }
    </style>
</head>

<body>
    <main>
        <section class="panel" aria-labelledby="visitor-title">
            <p class="eyebrow">CRM API live counter</p>
            <h1 id="visitor-title">Visitors</h1>
            <output id="count" aria-live="polite">...</output>
            <p id="status">Recording your visit.</p>
            <div class="actions"><a href="/swagger">Open API console</a></div>
        </section>
    </main>
    <script>
        const count = document.getElementById("count");
        const status = document.getElementById("status");
        const showCount = (result) => {
            count.value = result.count.toLocaleString();
            status.textContent = "Live total updated " + new Date(result.updatedAt).toLocaleTimeString();
        };
        const getCount = async () => {
            const response = await fetch("/api/v1/visitors/count");
            if (!response.ok) throw new Error("Unable to load visitor count.");
            showCount(await response.json());
        };
        const registerVisit = async () => {
            try {
                const response = await fetch("/api/v1/visitors/visit", { method: "POST" });
                if (!response.ok) throw new Error("Unable to record visit.");
                showCount(await response.json());
            } catch (error) {
                status.textContent = error.message;
            }
        };
        registerVisit();
        setInterval(() => getCount().catch(error => status.textContent = error.message), 3000);
    </script>
</body>

</html>
